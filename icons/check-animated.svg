<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
    <style>
        @media (prefers-reduced-motion: no-preference) {
            @keyframes ira-draw-stroke {
                0%, 8% { stroke-dashoffset: 1; opacity: 0; }
                13%, 100% { opacity: 1; }
                43%, 100% { stroke-dashoffset: 0; }
            }
            @keyframes ira-draw-loop {
                0%, 9%, 91%, 100% { opacity: 0; }
                14%, 78% { opacity: 1; }
            }
            [data-ira-drawing="check"] { animation: ira-draw-loop 2.8s ease-in-out infinite; }
            [data-ira-drawing="check"] > * {
                stroke-dasharray: 1 2;
                animation: ira-draw-stroke 2.8s ease-in-out infinite backwards;
            }
        }
    </style>
    <g data-ira-drawing="check">
        <path pathLength="1" d="M3.5 12 9 17.5 20.5 6"/>
    </g>
</svg>
