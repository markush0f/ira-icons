<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
    <style>
        @keyframes ira-svg {
            0%, 65%, 100% { transform: none; }
            30% { transform: scale(.89); }
        }
        @media (prefers-reduced-motion: no-preference) {
            [data-ira-motion="svg"] {
                transform-origin: 12px 12px;
                animation: ira-svg 2.8s ease-in-out infinite;
            }
        }
    </style>
    <g data-ira-motion="svg">
        <rect width="20" height="15" x="2" y="4.5" rx="3"/>
        <text x="12" y="15" fill="currentColor" stroke="none" font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle">SVG</text>
    </g>
</svg>
