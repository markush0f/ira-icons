<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
    <style>
        @media (prefers-reduced-motion: no-preference) {
            @keyframes ira-hourglass-empty {
                0%, 100% { transform: scaleX(1); opacity: 1; }
                72%, 89% { transform: scaleX(.25); opacity: 0; }
            }
            @keyframes ira-hourglass-fill {
                0%, 100% { transform: scale(.25); opacity: 0; }
                72%, 89% { transform: scale(1); opacity: 1; }
            }
            @keyframes ira-hourglass-flow {
                0%, 63% { opacity: 1; }
                71%, 100% { opacity: 0; }
            }
            @keyframes ira-hourglass-drop {
                0% { transform: translateY(-1.2px); opacity: 0; }
                22%, 62% { opacity: 1; }
                100% { transform: translateY(3px); opacity: 0; }
            }
            [data-ira-motion="hourglass-top"] {
                transform-origin: 12px 7px;
                animation: ira-hourglass-empty 3.2s linear infinite;
            }
            [data-ira-motion="hourglass-pile"] {
                transform-origin: 12px 19px;
                animation: ira-hourglass-fill 3.2s linear infinite;
            }
            [data-ira-motion="hourglass-stream"] { animation: ira-hourglass-flow 3.2s linear infinite; }
            [data-ira-motion="hourglass-grain"] { animation: ira-hourglass-drop .64s linear infinite; }
        }
    </style>
    <path d="M5 3h14M5 21h14M7 3v3c0 3 2 4.5 5 6-3 1.5-5 3-5 6v3M17 3v3c0 3-2 4.5-5 6 3 1.5 5 3 5 6v3"/>
    <path data-ira-motion="hourglass-top" d="M10 7h4"/>
    <path data-ira-motion="hourglass-pile" d="m10 19 2-2 2 2"/>
    <g data-ira-motion="hourglass-stream">
        <circle data-ira-motion="hourglass-grain" cx="12" cy="14" r=".8" fill="currentColor" stroke="none"/>
    </g>
</svg>
