<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
    <style>
        @keyframes ira-chevron-right {
            0%, 65%, 100% { transform: none; }
            30% { transform: translateX(1.5px); }
        }
        @media (prefers-reduced-motion: no-preference) {
            [data-ira-motion="chevron-right"] {
                transform-origin: 12px 12px;
                animation: ira-chevron-right 2.8s ease-in-out infinite;
            }
        }
    </style>
    <g data-ira-motion="chevron-right">
        <path d="m8.5 5 7 7-7 7"/>
    </g>
</svg>
