<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
    <style>
        @media (prefers-reduced-motion: no-preference) {
            @keyframes ira-toggle-slide {
                0%, 100% { transform: translateX(-7px); }
                28%, 72% { transform: translateX(0); }
            }
            @keyframes ira-toggle-track {
                0%, 100% { fill-opacity: 0; }
                28%, 72% { fill-opacity: .22; }
            }
            [data-ira-motion="toggle-knob"] { animation: ira-toggle-slide 2.6s cubic-bezier(.3, .8, .2, 1) infinite; }
            [data-ira-motion="toggle-track"] { animation: ira-toggle-track 2.6s ease-in-out infinite; }
        }
    </style>
    <rect data-ira-motion="toggle-track" x="2.5" y="6" width="19" height="12" rx="6" fill="currentColor" fill-opacity="0"/>
    <circle data-ira-motion="toggle-knob" cx="15.5" cy="12" r="2.5"/>
</svg>
