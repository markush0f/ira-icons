<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
    <style>
        @keyframes ira-search {
            0%, 80%, 100% { transform: translate(0, 0); }
            24% { transform: translate(-1.4px, .8px); }
            54% { transform: translate(1px, -1.3px); }
        }
        @media (prefers-reduced-motion: no-preference) {
            [data-ira-motion="search"] {
                animation: ira-search 3.2s ease-in-out infinite;
            }
        }
    </style>
    <g data-ira-motion="search">
        <circle cx="10" cy="10" r="7"/>
        <path d="m15 15 6 6"/>
    </g>
</svg>
