<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
    <style>
        @keyframes ira-alarm-clock {
            0%, 65%, 100% { transform: none; }
            30% { transform: rotate(-6deg); }
        }
        @media (prefers-reduced-motion: no-preference) {
            [data-ira-motion="alarm-clock"] {
                transform-origin: 12px 12px;
                animation: ira-alarm-clock 2.8s ease-in-out infinite;
            }
        }
    </style>
    <g data-ira-motion="alarm-clock">
        <circle cx="12" cy="13" r="7"/>
        <path d="M12 9v4l3 1M3 6l4-3m10 0 4 3M7 19l-2 2m12-2 2 2"/>
    </g>
</svg>
