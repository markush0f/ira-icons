<!doctype html>
<!-- Standalone preview of the original SVG files, with no build step or server required. -->
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ira Icons · SVG preview</title>
  <style>
    :root {
      font-family: system-ui, sans-serif;
      color: #182538;
      background: #f4f6fa;
    }

    body {
      max-width: 64rem;
      margin: 0 auto;
      padding: clamp(1rem, 5vw, 3rem);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.5rem);
    }

    p {
      color: #475569;
    }

    .catalog {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr));
      gap: 1rem;
      padding: 0;
      list-style: none;
    }

    .icon {
      padding: 1rem;
      border: 1px solid #d6dce6;
      border-radius: .75rem;
      background: #fff;
    }

    h2 {
      margin: 0 0 1rem;
      font-size: 1rem;
    }

    a {
      color: #294785;
    }

    .samples {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .5rem;
    }

    figure {
      margin: 0;
      text-align: center;
    }

    .sample {
      display: grid;
      place-items: center;
      min-height: 3.25rem;
      border-radius: .5rem;
      background: #f4f6fa;
    }

    [role="group"] { margin-top: 1rem; display: flex; gap: .25rem; }
    button[aria-pressed="true"] { color: white; background: #483582; }
    button[aria-pressed="true"] img { filter: invert(1); }
    figcaption {
      margin-top: .375rem;
      color: #475569;
      font-size: .75rem;
    }
  </style>
</head>

<body>
  <main>
    <h1>Ira Icons</h1>
    <p>Compare outline icons at 16, 24, and 32 px. Select a name to open the original SVG.</p>
    <ul class="catalog" id="catalog" aria-label="Icon catalog"></ul>
    <noscript>Enable JavaScript to view the icon catalog.</noscript>
  </main>
  <template id="icon-card">
    <li class="icon">
      <h2><a></a></h2>
      <div class="samples"></div>
    </li>
  </template>
  <template id="icon-sample">
    <figure>
      <div class="sample"><img alt=""></div>
      <figcaption></figcaption>
    </figure>
  </template>
  <script>
    // Keep this list explicit so the standalone preview works without a server or build step.
    const icons = [
      "activity", "airplane", "alarm-clock", "alert-circle", "alert-triangle", "align-center", "align-justify", "align-left",
      "align-right", "anchor", "apple", "archive", "arrow-down", "arrow-down-left", "arrow-down-right", "arrow-left",
      "arrow-left-right", "arrow-right", "arrow-to-bottom", "arrow-to-left", "arrow-to-right", "arrow-to-top", "arrow-up", "arrow-up-down",
      "arrow-up-left", "arrow-up-right", "at-sign", "atom", "audio-lines", "backpack", "bandage", "bank",
      "banknote", "banknotes", "barcode", "barcode-scan", "baseball", "basketball", "battery-charging", "beaker",
      "bed", "bee", "bell", "bicycle", "bird", "bluetooth", "bookmark", "bowl",
      "bread", "briefcase", "bug", "burger", "bus", "butterfly", "cable", "cactus",
      "cake", "calendar", "camera", "camera-off", "candy", "canoe", "car", "card-contactless",
      "carrot", "cart-check", "cart-minus", "cart-plus", "cart-remove", "cash-register", "cassette", "chair",
      "chart-bar", "chart-line", "chat", "check", "chevron-down", "chevron-left", "chevron-right", "chevron-up",
      "chip", "clapperboard", "clipboard", "clipboard-list", "clock", "close", "cloud", "cloud-drizzle",
      "cloud-fog", "cloud-hail", "cloud-lightning", "cloud-moon", "cloud-rain", "cloud-rain-sun", "cloud-snow", "cloud-sun",
      "cloud-wind", "code", "coffee", "coins", "collapse", "comet", "compass", "cooking-pot",
      "copy", "corner-down-left", "corner-down-right", "corner-up-left", "corner-up-right", "coupon", "credit-card", "croissant",
      "crosshair", "cup", "database", "desert", "desktop-tower", "discount", "dollar", "door-closed",
      "door-open", "double-chevron-down", "double-chevron-left", "double-chevron-right", "double-chevron-up", "download", "droplet", "droplets",
      "dumbbell", "edit", "egg", "eraser", "ethernet", "euro", "expand", "external-link",
      "eye", "eye-off", "face-id", "fan", "fast-forward", "faucet", "feather", "file",
      "file-audio", "file-chart", "file-check", "file-code", "file-down", "file-heart", "file-image", "file-lock",
      "file-minus", "file-plus", "file-search", "file-spreadsheet", "file-star", "file-text", "file-up", "file-video",
      "file-x", "file-zip", "film", "filter", "fingerprint", "first-aid", "fish", "flag",
      "flame", "flash", "flask", "flood", "flower", "flower-stem", "folder", "folder-check",
      "folder-down", "folder-heart", "folder-lock", "folder-minus", "folder-plus", "folder-search", "folder-star", "folder-tree",
      "folder-up", "folder-x", "football", "gauge", "gift", "glass-water", "globe", "grid",
      "hammer", "hard-drive", "hash", "headphones", "heart", "helicopter", "helix", "help-circle",
      "home", "hot-air-balloon", "hourglass", "humidity", "hurricane", "ice-cream", "icicle", "image",
      "info", "invoice", "island", "kettle", "keyboard", "lab-goggles", "lamp", "laptop",
      "laser", "layers", "leaf", "leaves", "life-buoy", "lightbulb", "lightbulb-off", "link",
      "list", "lock", "luggage", "magnet", "mail", "map-folded", "map-pin", "maximize",
      "medal", "megaphone", "memory-card", "menu", "microphone", "microphone-off", "microscope", "minus",
      "modem", "molecule", "monitor", "moon", "moon-stars", "more-horizontal", "more-vertical", "motorcycle",
      "mountain", "mountains", "mouse", "move", "mushroom", "music-note", "music-notes", "network",
      "orbit", "outlet", "package", "package-check", "package-open", "paint-roller", "paintbrush", "palette",
      "paperclip", "parking", "passport", "pause", "pause-circle", "paw-print", "pencil", "percent",
      "picture-in-picture", "piggy-bank", "pill", "pipette", "pizza", "plane-landing", "plane-takeoff", "planet",
      "play", "play-circle", "plug", "plus", "podcast", "pound", "power-button", "price-tag",
      "price-tags", "printer", "qr-code", "radio", "radio-tower", "rainbow", "receipt", "record",
      "refresh", "repeat", "rewind", "rocket", "route", "router", "ruler", "safe",
      "sailboat", "sandwich", "satellite", "satellite-dish", "save", "scan", "scanner", "scissors",
      "scooter", "screwdriver", "search", "send", "server", "settings", "share", "shell",
      "shield", "ship", "shopping-bag", "shopping-basket", "shopping-cart", "shuffle", "signpost", "skateboard",
      "skip-back", "skip-forward", "slash", "sliders", "smartphone", "smartwatch", "smile", "snowflake",
      "sofa", "sort-ascending", "sort-descending", "speaker", "spoon", "sprout", "square", "star",
      "stethoscope", "stop-circle", "stopwatch", "storefront", "subtitles", "subway", "sun", "sunrise",
      "sunset", "svg", "table", "tablet", "tag", "tape-measure", "taxi", "teapot",
      "telescope", "television", "tennis-ball", "terminal", "test-tube", "thermometer", "thermometer-cold", "thermometer-hot",
      "thumbs-up", "ticket", "toggle-right", "toolbox", "tornado", "traffic-light", "train", "tram",
      "trash", "tree-deciduous", "tree-pine", "trophy", "truck", "ultraviolet", "umbrella", "unlock",
      "upload", "usb-drive", "user", "users", "utensils", "van", "video", "vinyl",
      "volcano", "volume", "volume-low", "volume-mute", "wallet", "water-bottle", "water-level", "waveform",
      "waves", "weather-vane", "webcam", "wifi", "wind", "window", "wine-glass", "wrench",
      "yen", "zap", "zoom-in", "zoom-out"
    ];
    const variants = [['Animado', '-animated', 'play'], ['Minimalista', '-minimalist', 'minus'], ['Normal', '', 'square']];
    const sizes = [16, 24, 32];
    const catalog = document.querySelector('#catalog');
    const cardTemplate = document.querySelector('#icon-card');
    const sampleTemplate = document.querySelector('#icon-sample');

    for (const name of icons) {
      const path = `icons/${name}-animated.svg`;
      const card = cardTemplate.content.cloneNode(true);
      const link = card.querySelector('a');
      link.href = path;
      link.textContent = name;
      const samples = card.querySelector('.samples');

      for (const size of sizes) {
        const sample = sampleTemplate.content.cloneNode(true);
        const image = sample.querySelector('img');
        image.width = size;
        image.height = size;
        image.src = path;
        sample.querySelector('figcaption').textContent = `${size} px`;
        samples.append(sample);
      }

      const options = document.createElement('div');
      options.setAttribute('role', 'group');
      options.setAttribute('aria-label', name);
      for (const [label, suffix, glyph] of variants) {
        const button = document.createElement('button');
        button.type = 'button';
        button.title = label;
        button.setAttribute('aria-label', label);
        const icon = document.createElement('img');
        icon.src = `icons/${glyph}.svg`;
        icon.width = icon.height = 20;
        icon.alt = '';
        button.append(icon);
        button.setAttribute('aria-pressed', String(suffix === '-animated'));
        button.onclick = () => {
          const src = `icons/${name}${suffix}.svg`;
          link.href = src;
          samples.querySelectorAll('img').forEach(image => image.src = src);
          for (const option of options.children) option.setAttribute('aria-pressed', String(option === button));
        };
        options.append(button);
      }
      samples.after(options);
      catalog.append(card);
    }
  </script>
</body>

</html>
