      grid-template-columns: repeat(3, 1fr);
      gap: .5rem;
    }

    figure {
      margin: 0;
      text-align: center;
    }

    .sample {
      display: grid;
      place-items: center;
      min-height: 3.25rem;
      border-radius: .5rem;
      background: #f4f6fa;
    }

    [role="group"] { margin-top: 1rem; display: flex; gap: .25rem; }
    button[aria-pressed="true"] { color: white; background: #483582; }
    button[aria-pressed="true"] img { filter: invert(1); }
    figcaption {
      margin-top: .375rem;
      color: #475569;
      font-size: .75rem;

            icon.alt = '';
            button.append(icon);
            button.setAttribute('aria-pressed', String(suffix === '-animated'));
            button.onclick = () => {
                const src = `icons/${name}${suffix}.svg`;
                link.href = src;
                samples.querySelectorAll('img').forEach(image => image.src = src);
                for (const option of options.children)
                    option.setAttribute('aria-pressed', String(option === button));
            };
            options.append(button);
        }
        samples.after(options);
        catalog.append(card);
    }
    // End generated standalone script.
  </script>
